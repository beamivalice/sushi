name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + test + package only — skip tag, notarize, and release. Use to verify the workflow on a branch before cutting a real release."
        type: boolean
        default: false
      pre_release:
        description: "Cut this as a pre-release: tag v<MAJOR.MINOR.PATCH>-pre-release.<n> instead of v<MAJOR.MINOR.PATCH>"
        type: boolean
        default: false

# Pull requests run ci.yml only. Release runs (tag push / dispatch) are never cancelled.
concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # macos-26 (Tahoe): the runner SDK the shipped binary is built against.
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: No local paths in tracked files
        run: bash tests/test_no_local_paths.sh

      - name: Select Xcode (Metal toolchain for the MLX kernels)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Zig
        run: |
          bash scripts/fetch-zig.sh
          echo "$GITHUB_WORKSPACE/.zig-toolchain" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: brew bundle install --file=Brewfile

      # mlx + mlx-c are pinned submodules built from source with deployment
      # target 26.2 so MLX's NAX (M5 neural-accelerator) kernels are compiled
      # in — the Homebrew bottle is built at 26.0 and ships with them silently
      # disabled (MLX_METAL_NO_NAX). scripts/build-mlx.sh asserts the built
      # metallib actually contains *_nax kernels. Compiling needs no M5: the
      # runtime probe (GPU gen >= 17) gates dispatch on user machines.
      - name: Compute mlx pin cache key
        id: mlxpin
        run: |
          echo "mlx=$(git -C lib/mlx-src rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "mlxc=$(git -C lib/mlxc-src rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "xcode=$(xcodebuild -version | tr ' \n' '--')" >> "$GITHUB_OUTPUT"

      - name: Cache self-built mlx + mlx-c
        uses: actions/cache@v4
        with:
          path: lib/mlx
          key: mlx-stage-${{ steps.mlxpin.outputs.mlx }}-${{ steps.mlxpin.outputs.mlxc }}-${{ steps.mlxpin.outputs.xcode }}

      - name: Build mlx + mlx-c (NAX-enabled)
        run: |
          # Xcode 26 ships the Metal compiler as a separate component; fetch it
          # if the image doesn't have it (build-mlx.sh hard-fails without it).
          xcrun -sdk macosx metal --version >/dev/null 2>&1 \
            || sudo xcodebuild -downloadComponent MetalToolchain
          bash scripts/build-mlx.sh

      # Without a Developer ID in the repo secrets the binary ships ad-hoc signed and not notarized.
      - name: Detect signing identity
        id: signing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        run: echo "enabled=$([ -n "$APPLE_CERTIFICATE_BASE64" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Extract version
        id: version
        # SemVer MAJOR.MINOR.PATCH from build.zig.zon, checked by the same
        # release.sh functions a local dispatch runs.
        run: |
          source ./release.sh
          BASE="$(zon_version build.zig.zon)"
          is_semver "$BASE" || { echo "::error::build.zig.zon version '$BASE' is not MAJOR.MINOR.PATCH"; exit 1; }
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.pre_release }}" = "true" ]; then
              # A pre-release does NOT consume the version: it tags
              # v<BASE>-pre-release.<P>, P counting this version's pre-releases
              # from 1 off the existing tags, so a sequence reads
              # v1.0.0-pre-release.1, .2 and then v1.0.0.
              LAST_P=$(git ls-remote --tags origin "v${BASE}-pre-release.*" \
                | sed -n "s#.*refs/tags/v${BASE}-pre-release\\.\\([0-9][0-9]*\\)\$#\\1#p" \
                | sort -n | tail -1)
              VERSION="${BASE}-pre-release.$(( ${LAST_P:-0} + 1 ))"
            else
              VERSION="$(release_version CHANGELOG.md build.zig.zon)"
            fi
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            tag_version_ok "$VERSION" "$BASE" \
              || { echo "::error::tag $GITHUB_REF_NAME is neither v$BASE nor v$BASE-pre-release.<n>"; exit 1; }
            if [ "$VERSION" = "$BASE" ]; then
              release_version CHANGELOG.md build.zig.zon >/dev/null
            fi
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build sushi (Zig)
        run: zig build -Doptimize=ReleaseFast -Dversion=${{ steps.version.outputs.version }} -Dgit-sha=${{ github.sha }}

      - name: Smoke test sushi binary
        run: |
          ./zig-out/bin/sushi --version
          ./zig-out/bin/sushi --help > /dev/null

      # Static guard: the staged metallib contains the *_nax kernels, minos
      # >= 26.2, and the built binary links no leftover brew mlx/mlx-c. ci.yml
      # runs the same check, but a cache-miss rebuild on THIS runner is the
      # stage that actually ships in the tarball — guard it here too.
      - name: Verify staged mlx (NAX kernels + minos)
        run: bash tests/test_mlx_staged_nax.sh

      - name: Run Zig tests
        run: zig build test -Doptimize=ReleaseFast --summary all

      # Tagged only once the suite is green, so a failed test leaves no tag behind.
      - name: Create tag (manual dispatch)
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        run: |
          git tag v${{ steps.version.outputs.version }}
          git push origin v${{ steps.version.outputs.version }}

      # ── CLI tarball (standalone binary + libs) ──
      - name: Package CLI binary
        env:
          SIGNING_IDENTITY: "Developer ID Application: Theinruj Toranavikrai (${{ secrets.APPLE_TEAM_ID }})"
        run: |
          STAGING="sushi-macos-arm64"
          mkdir -p "$STAGING/lib"

          cp zig-out/bin/sushi "$STAGING/"

          # License + third-party attributions. The tarball links Apache-2.0
          # code (MTPLX/dflash/oMLX kernels, jinja.cpp) whose section 4 wants
          # the license text and the NOTICE attributions to reach whoever
          # receives the binary — a NOTICE that only lives in the git repo
          # reaches nobody who downloads a release.
          cp LICENSE LICENSE-APACHE-2.0 NOTICE "$STAGING/"

          # Self-built mlx + mlx-c (scripts/build-mlx.sh): libmlxc + libmlx +
          # sibling deps like libjaccl (@rpath-referenced — missing them causes
          # a "no such file" dyld error at startup) + the NAX-enabled metallib.
          cp lib/mlx/lib/*.dylib "$STAGING/lib/"
          cp lib/mlx/lib/mlx.metallib "$STAGING/lib/"

          # WebP libraries for vision pipeline
          WEBP_LIB="$(brew --prefix webp)/lib"
          [ -f "$WEBP_LIB/libwebp.dylib" ] && cp "$WEBP_LIB/libwebp.dylib" "$STAGING/lib/"
          [ -f "$WEBP_LIB/libsharpyuv.dylib" ] && cp "$WEBP_LIB/libsharpyuv.dylib" "$STAGING/lib/"

          install_name_tool -change \
            @rpath/libmlxc.dylib \
            @executable_path/lib/libmlxc.dylib \
            "$STAGING/sushi"

          install_name_tool -change \
            @rpath/libmlx.dylib \
            @loader_path/libmlx.dylib \
            "$STAGING/lib/libmlxc.dylib"

          # Add @loader_path to libmlx.dylib's rpath so its @rpath/libjaccl.dylib (and any
          # future @rpath sibling deps) resolves to the same lib/ dir we just populated.
          install_name_tool -add_rpath @loader_path "$STAGING/lib/libmlx.dylib" 2>/dev/null || true

          # Fix webp rpaths
          if [ -f "$STAGING/lib/libwebp.dylib" ]; then
            install_name_tool -change \
              "$(otool -L "$STAGING/sushi" | grep libwebp | awk '{print $1}')" \
              @executable_path/lib/libwebp.dylib \
              "$STAGING/sushi" 2>/dev/null || true
            install_name_tool -change \
              "$(otool -L "$STAGING/lib/libwebp.dylib" | grep libsharpyuv | awk '{print $1}')" \
              @loader_path/libsharpyuv.dylib \
              "$STAGING/lib/libwebp.dylib" 2>/dev/null || true
          fi

          # The hardened runtime rejects libraries without a Team ID, so an ad-hoc build must go without it.
          RUNTIME_FLAG=(--options runtime)
          if [ "${{ steps.signing.outputs.enabled }}" != "true" ]; then SIGNING_IDENTITY=-; RUNTIME_FLAG=(); fi
          for lib in "$STAGING/lib/"*.dylib; do
            [ -f "$lib" ] && codesign --force "${RUNTIME_FLAG[@]}" --sign "$SIGNING_IDENTITY" "$lib"
          done
          codesign --force "${RUNTIME_FLAG[@]}" --sign "$SIGNING_IDENTITY" "$STAGING/sushi"

          codesign --verify --deep --strict --verbose=2 "$STAGING/sushi"

          # Smoke test the install_name_tool-rewired binary so missing-dylib
          # errors surface here rather than after notarization.
          "./$STAGING/sushi" --version

          # What a host that runs this release as its engine checks first.
          "./$STAGING/sushi" --guest-manifest > "$STAGING/guest.json"
          python3 -c 'import json, sys; m = json.load(open(sys.argv[1])); assert m["version"] == sys.argv[2] and m["guest_api"] == 1, m' \
            "$STAGING/guest.json" "${{ steps.version.outputs.version }}"

          ditto -c -k --keepParent "$STAGING" "sushi-cli.zip"

      - name: Notarize CLI
        if: ${{ !inputs.dry_run && steps.signing.outputs.enabled == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "sushi-cli.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      # ── Package final artifacts ──
      - name: Package CLI tarball
        run: |
          tar -czf "sushi-bin-macos-arm64.tar.gz" "sushi-macos-arm64"
          shasum -a 256 "sushi-bin-macos-arm64.tar.gz" > "sushi-bin-macos-arm64.tar.gz.sha256"

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/signing.keychain-db || true

      # Pulls the top entry out of CHANGELOG.md (from its "## v..." heading
      # down to, but not including, the "---" separator) so the release body
      # matches what we already wrote by hand instead of GitHub's auto-generated
      # commit list.
      - name: Extract changelog entry
        if: ${{ !inputs.dry_run }}
        id: changelog
        run: |
          ENTRY=$(awk '
            /^## / { c++; if (c==2) exit }
            /^---$/ { if (c==1) exit }
            c==1 { print }
          ' CHANGELOG.md)
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$ENTRY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # The release is created as a DRAFT so its assets can be checked before
      # anyone can download them.
      - name: Create Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: sushi v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: true
          files: |
            sushi-bin-macos-arm64.tar.gz
            sushi-bin-macos-arm64.tar.gz.sha256

      - name: Upload dry-run artifacts
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ steps.version.outputs.version }}
          path: |
            sushi-bin-macos-arm64.tar.gz
            sushi-bin-macos-arm64.tar.gz.sha256
          retention-days: 7
