name: CI

# Build + test on every PR (the only workflow a PR runs), plus manual dispatch. A direct push to main does
# NOT trigger it: that path gates nobody, and it is worth a 90-minute macOS
# runner. Add `workflow_dispatch` runs from the Actions tab when a push needs
# the suite. Mirrors the build/test portion of release.yml (same macos-26
# runner, same steps, same mlx cache key — the two workflows share the
# self-built mlx stage) without signing/notarize/packaging.
#
# This is also the macOS 26.2 compatibility gate: dev machines may run newer
# macOS betas, but the shipped binaries must keep building and testing against
# the 26.x SDK the runner provides (build.zig targets os_version_min 26.2).

on:
  pull_request:
  workflow_dispatch:
    inputs:
      tier:
        description: "host: the tests that link no MLX. all: the whole suite, which needs a GPU the runner may not have"
        type: choice
        options: [host, all]
        default: host
      test_filter:
        description: "Only the tests whose name contains one of these ';'-separated substrings (empty: every test of the tier)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: No local paths in tracked files
        run: bash tests/test_no_local_paths.sh

      - name: Set up the build
        id: setup
        uses: ./.github/actions/setup-build

      # Bounded: the key is written once per toolchain/build/submodule set, so
      # later runs restore it and never re-save a growing cache. Xcode is in the
      # key because zig caches configure-time SDK paths.
      - name: Cache Zig build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-cache-${{ hashFiles('scripts/fetch-zig.sh', 'build.zig', 'build.zig.zon') }}-${{ steps.setup.outputs.submodules }}-${{ steps.setup.outputs.xcode }}

      - name: Build and test macOS controls
        run: |
          apps/SushiControl/macos/test.sh
          BUILD_DIR="$RUNNER_TEMP/sushi-control" apps/SushiControl/macos/build.sh

      - name: Build sushi (Zig, ReleaseFast)
        run: zig build -Doptimize=ReleaseFast

      # Compile only: a microbench needs a quiet box and a GPU, so nothing runs.
      - name: Build sushi-ubench
        run: zig build ubench

      - name: Smoke test sushi binary
        run: |
          ./zig-out/bin/sushi --version
          ./zig-out/bin/sushi --help > /dev/null

      # Static guard: staged metallib contains the *_nax kernels, minos >= 26.2,
      # and the built binary links no leftover brew mlx/mlx-c.
      - name: Verify staged mlx (NAX kernels + minos)
        run: bash tests/test_mlx_staged_nax.sh

      - name: Test tier
        uses: ./.github/actions/test-host
        with:
          tier: ${{ inputs.tier || 'host' }}
          test_filter: ${{ inputs.test_filter }}
