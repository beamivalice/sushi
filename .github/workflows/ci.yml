name: CI

# Build + test on every PR (the only workflow a PR runs), plus manual dispatch. A direct push to main does
# NOT trigger it: that path gates nobody, and it is worth a 90-minute macOS
# runner. Add `workflow_dispatch` runs from the Actions tab when a push needs
# the suite. Mirrors the build/test portion of release.yml (same macos-26
# runner, same steps, same mlx cache key — the two workflows share the
# self-built mlx stage) without signing/notarize/packaging.
#
# This is also the macOS 26.2 compatibility gate: dev machines may run newer
# macOS betas, but the shipped binaries must keep building and testing against
# the 26.x SDK the runner provides (build.zig targets os_version_min 26.2).

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: No local paths in tracked files
        run: bash tests/test_no_local_paths.sh

      - name: Select Xcode (Metal toolchain for the MLX kernels)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Zig (pinned)
        run: |
          bash scripts/fetch-zig.sh
          echo "$GITHUB_WORKSPACE/.zig-toolchain" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: brew bundle install --file=Brewfile

      # Same key as release.yml so CI runs on main keep the cache warm for
      # release tag builds (and vice versa).
      - name: Compute mlx pin cache key
        id: mlxpin
        run: |
          echo "mlx=$(git -C lib/mlx-src rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "mlxc=$(git -C lib/mlxc-src rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "xcode=$(xcodebuild -version | tr ' \n' '--')" >> "$GITHUB_OUTPUT"
          echo "submodules=$(git submodule status | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Cache self-built mlx + mlx-c
        uses: actions/cache@v4
        with:
          path: lib/mlx
          key: mlx-stage-${{ steps.mlxpin.outputs.mlx }}-${{ steps.mlxpin.outputs.mlxc }}-${{ steps.mlxpin.outputs.xcode }}

      - name: Build mlx + mlx-c (NAX-enabled)
        run: |
          # Xcode 26 ships the Metal compiler as a separate component; fetch it
          # if the image doesn't have it (build-mlx.sh hard-fails without it).
          xcrun -sdk macosx metal --version >/dev/null 2>&1 \
            || sudo xcodebuild -downloadComponent MetalToolchain
          bash scripts/build-mlx.sh


      # Bounded: the key is written once per toolchain/build/submodule set, so
      # later runs restore it and never re-save a growing cache. Xcode is in the
      # key because zig caches configure-time SDK paths.
      - name: Cache Zig build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-cache-${{ hashFiles('scripts/fetch-zig.sh', 'build.zig', 'build.zig.zon') }}-${{ steps.mlxpin.outputs.submodules }}-${{ steps.mlxpin.outputs.xcode }}

      - name: Build sushi (Zig, ReleaseFast)
        run: zig build -Doptimize=ReleaseFast

      - name: Smoke test sushi binary
        run: |
          ./zig-out/bin/sushi --version
          ./zig-out/bin/sushi --help > /dev/null

      # Static guard: staged metallib contains the *_nax kernels, minos >= 26.2,
      # and the built binary links no leftover brew mlx/mlx-c.
      - name: Verify staged mlx (NAX kernels + minos)
        run: bash tests/test_mlx_staged_nax.sh

      - name: Run Zig tests
        run: zig build test -Doptimize=ReleaseFast --summary all
